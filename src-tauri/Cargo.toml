[package]
name = "app-comptabiliter"
version = "0.1.0"
description = "Assistant de comptabilite fournisseurs pour Charlemagne"
authors = ["App Comptabiliter"]
edition = "2021"

[lib]
name = "app_comptabiliter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
